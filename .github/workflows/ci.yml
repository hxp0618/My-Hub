name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gates
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Upload Chrome extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-hub-chrome
          path: dist_chrome

      - name: Upload Firefox extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-hub-firefox
          path: dist_firefox
